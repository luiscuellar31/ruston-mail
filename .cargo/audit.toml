[advisories]
ignore = [
    # Transitive through pgp 0.19's PQC support. Its ml-dsa 0.0 API is not
    # compatible with the fixed 0.1 release candidates yet.
    "RUSTSEC-2025-0144",
    # Transitive through pgp/proton-rpgp; the advisory has no patched rsa
    # release. Keep visible here until upstream provides a migration path.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 can branch on secret values; only 0.7.6 fixes it.
    # pgp (cx448, elliptic-curve 0.13) and proton-srp still use 0.5.5. Remove
    # this once proton-crypto brings crypto-bigint 0.7.6 or later.
    "RUSTSEC-2026-0387",
]
