[workspace]
resolver = "2"
members = [
    ".",
    "crates/ruston-core",
    "crates/ruston-cli",
]
default-members = ["."]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/luiscuellar31/ruston-mail"
authors = ["Luis Cuellar <luiscuellar31@proton.me>"]

[workspace.dependencies]
ruston-core = { path = "crates/ruston-core" }
proton-crypto = { version = "0.12", default-features = false, features = ["rustpgp"] }
proton-srp = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "gzip", "system-proxy"] }
# reqwest's own rustls, declared for a feature its defaults leave off: TLS then
# offers the X25519MLKEM768 post-quantum hybrid key exchange first.
rustls = { version = "0.23", default-features = false, features = ["prefer-post-quantum"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
keyring = "4"
mail-parser = "0.11"
thiserror = "2"
base64 = "0.22"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
secrecy = "0.10"
zeroize = "1"
getrandom = "0.4"
chrono = "0.4"
futures = "0.3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ammonia = "4.1.7"
html5ever = "0.39"
url = "2"
rpassword = "7"
wiremock = "0.6"

# Shipped binaries come out about a third smaller, at the cost of slower
# release builds. Panics still name their source line; backtraces lose
# function names. Unwinding stays on so a panicking task does not end the app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "ruston-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unofficial native desktop client for Proton Mail"
license.workspace = true
repository.workspace = true
default-run = "ruston"

[[bin]]
name = "ruston"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
html5ever = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", default-features = false, features = ["image", "svg"] }
ruston-core = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
skrifa = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
url = { workspace = true }
urlencoding = { workspace = true }
zeroize = { workspace = true }
rfd = "0.17.2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
zbus = { version = "5", features = ["p2p"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows draws with DirectX 12, which also runs on WARP, Windows' software
# renderer, where there is no GPU; OpenGL stays as the fallback.
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12"] }
windows-sys ={ version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSWindow", "NSView"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotificationSettings"] }
block2 = "0.6"
