[package]
name = "ruston-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Unofficial native desktop client for Proton Mail"
license = "MIT"
repository = "https://github.com/luiscuellar31/ruston-mail"
default-run = "ruston"

[[bin]]
name = "ruston"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
iced = { version = "0.14", features = ["tokio"] }
proton-core = { git = "https://github.com/luiscuellar31/protonmail-rs.git", branch = "fix/captcha-chrome-hv" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
