[workspace]
resolver = "2"
members = [
    ".",
    "crates/ruston-core",
    "crates/ruston-cli",
]
default-members = ["."]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/luiscuellar31/ruston-mail"
authors = ["Luis Cuellar <luiscuellar31@proton.me>"]

[workspace.dependencies]
ruston-core = { path = "crates/ruston-core" }
proton-crypto = { version = "0.12", default-features = false, features = ["rustpgp"] }
proton-srp = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "multipart"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
mail-parser = "0.11"
thiserror = "2"
base64 = "0.22"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
secrecy = "0.10"
zeroize = "1"
chrono = "0.4"
futures = "0.3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ammonia = "4"
html5ever = "0.39"
url = "2"
rpassword = "7"
wiremock = "0.6"

[package]
name = "ruston-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unofficial native desktop client for Proton Mail"
license.workspace = true
repository.workspace = true
default-run = "ruston"

[[bin]]
name = "ruston"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = { workspace = true }
futures = { workspace = true }
html5ever = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
ruston-core = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
url = { workspace = true }
zeroize = { workspace = true }
rfd = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserNotification"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile"] }
