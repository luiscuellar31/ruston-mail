[package]
name = "ruston-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Unofficial native desktop client for Proton Mail"
license = "MIT"
repository = "https://github.com/luiscuellar31/ruston-mail"
default-run = "ruston"

[[bin]]
name = "ruston"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
futures = "0.3"
html5ever = "0.39"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# A commit, not a branch: a branch would let the next `cargo update` build
# whatever had been pushed to it since, without anyone asking for it. New
# revisions come from dev/luiscuellar31, where the fork's own work is
# integrated, and are taken up here one at a time.
proton-core = { git = "https://github.com/luiscuellar31/protonmail-rs.git", rev = "1cba4d5eb6df433fd1836a4c388cb6d54cb34dd0" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
url = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile"] }
