name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes the run before it irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both answers are wanted: one platform failing should not hide the
      # other's result.
      fail-fast: false
      matrix:
        # Each compiles code the other never does. The keyboard hints in the
        # settings panel are chosen with cfg(target_os), and macOS is where
        # Ruston Mail is developed while Linux is what its window features
        # are built for.
        os: [ubuntu-latest, macos-latest]

    steps:
      # Actions are pinned to a commit for the reason proton-core is: a tag
      # can be moved to whatever has been pushed to it since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features
