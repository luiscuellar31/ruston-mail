name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes the run before it irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both answers are wanted: one platform failing should not hide the
      # other's result.
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (x86_64)
            os: ubuntu-latest
            cache-key: ubuntu-x86_64
          - name: Ubuntu (arm64)
            os: ubuntu-24.04-arm
            cache-key: ubuntu-arm64
          - name: macOS (arm64)
            os: macos-latest
            cache-key: macos-arm64
          - name: macOS (x86_64)
            os: macos-15-intel
            cache-key: macos-x86_64

    steps:
      # Actions are pinned to a commit SHA so CI builds remain deterministic.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.cache-key }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps --all-features

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Ensure clean workspace
        run: git diff --exit-code

  deny:
    name: Dependency & license integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bnjbvr/cargo-machete@main
