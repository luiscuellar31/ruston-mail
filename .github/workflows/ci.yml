name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes the run before it irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # GitHub provides Bash on Windows too; keep fail-fast command handling
        # consistent across the matrix.
        shell: bash
    strategy:
      # One platform failing should not hide the other platforms' results.
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (x86_64)
            os: ubuntu-latest
            cache-key: ubuntu-x86_64
          - name: Ubuntu (arm64)
            os: ubuntu-24.04-arm
            cache-key: ubuntu-arm64
          - name: macOS (arm64)
            os: macos-latest
            cache-key: macos-arm64
          - name: macOS (x86_64)
            os: macos-15-intel
            cache-key: macos-x86_64
          - name: Windows (x86_64)
            os: windows-2025
            cache-key: windows-x86_64

    steps:
      # Actions are pinned to a commit SHA so CI builds remain deterministic.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.cache-key }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Validate Linux desktop entry
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils
          desktop-file-validate packaging/linux/com.luiscuellar.ruston-mail.desktop

      - name: Build Windows desktop executable
        if: runner.os == 'Windows'
        run: cargo build --locked --bin ruston

      - name: Validate Windows mailto registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner is disposable. Test registration and quoted executable
          # paths without changing the Windows default protocol association.
          $folder = Join-Path $env:RUNNER_TEMP 'Ruston mailto test'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $executable = Join-Path $folder 'ruston.exe'
          Copy-Item -LiteralPath 'target/debug/ruston.exe' -Destination $executable
          $choice = 'HKCU:\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\mailto\UserChoice'
          $before = if (Test-Path $choice) { Get-ItemProperty $choice | ConvertTo-Json } else { '' }
          & ./packaging/windows/register-mailto.ps1 -ExecutablePath $executable
          $command = (Get-Item 'HKCU:\Software\Classes\com.luiscuellar.ruston-mail.mailto\shell\open\command').GetValue('')
          if ($command -ne ('"{0}" "%1"' -f $executable)) { throw 'Executable path was not quoted correctly.' }
          $handler = Get-ItemPropertyValue 'HKCU:\Software\Ruston Mail\Capabilities\UrlAssociations' -Name mailto
          if ($handler -ne 'com.luiscuellar.ruston-mail.mailto') { throw 'MAILTO capability was not registered.' }
          $registered = Get-ItemPropertyValue 'HKCU:\Software\RegisteredApplications' -Name 'Ruston Mail'
          if ($registered -ne 'Software\Ruston Mail\Capabilities') { throw 'Application registration is missing.' }
          $after = if (Test-Path $choice) { Get-ItemProperty $choice | ConvertTo-Json } else { '' }
          if ($after -ne $before) { throw 'Registration changed the default MAILTO association.' }

      - name: Verify Windows executable metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata' }
          $package = $metadata.packages | Where-Object { $_.name -eq 'ruston-mail' }
          $version = (Get-Item target/debug/ruston.exe).VersionInfo
          if ($version.ProductName -ne 'Ruston Mail' -or
              $version.ProductVersion -ne $package.version -or
              $version.FileDescription -ne 'Ruston Mail' -or
              $version.Comments -ne $package.description -or
              $version.OriginalFilename -ne 'ruston.exe') {
              throw 'Windows executable metadata does not match the desktop package'
          }

      - name: Ensure clean workspace
        run: git diff --exit-code

  deny:
    name: Dependency & license integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bnjbvr/cargo-machete@main
