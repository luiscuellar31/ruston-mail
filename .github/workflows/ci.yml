name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks only read the repository; a compromised step gets no write access.
permissions:
  contents: read

# A newer push makes the run before it irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # GitHub provides Bash on Windows too; keep fail-fast command handling
        # consistent across the matrix.
        shell: bash
    strategy:
      # One platform failing should not hide the other platforms' results.
      fail-fast: false
      matrix:
        include:
          # Linux images are named rather than -latest, so a new Ubuntu
          # reaches CI only when this file says so.
          - name: Ubuntu (x86_64)
            os: ubuntu-24.04
            cache-key: ubuntu-x86_64
          - name: Ubuntu (arm64)
            os: ubuntu-24.04-arm
            cache-key: ubuntu-arm64
          - name: macOS (arm64)
            os: macos-latest
            cache-key: macos-arm64
          - name: macOS (x86_64)
            os: macos-15-intel
            cache-key: macos-x86_64
          - name: Windows (x86_64)
            os: windows-2025
            cache-key: windows-x86_64
          - name: Windows (arm64)
            os: windows-11-arm
            cache-key: windows-arm64

    steps:
      # Actions are pinned to a commit SHA so CI builds remain deterministic.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # aws-lc-sys builds its ARM64 code with clang-cl from LLVM.
      - name: Put clang-cl on the PATH
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
            $env:PATH = "$llvm;$env:PATH"
            $llvm >> $env:GITHUB_PATH
          }
          clang-cl --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.cache-key }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Validate Linux desktop entry and AppStream metadata
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils appstream
          desktop-file-validate packaging/linux/com.luiscuellar.ruston-mail.desktop
          # Warnings fail validation too; --no-net keeps CI off the network.
          appstreamcli validate --no-net packaging/linux/com.luiscuellar.ruston-mail.appdata.xml

      - name: Build Windows executables
        if: runner.os == 'Windows'
        run: cargo build --locked -p ruston-mail -p ruston-cli --bins

      - name: Validate Windows mailto registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner is disposable. Test registration and quoted executable
          # paths without changing the Windows default protocol association.
          $folder = Join-Path $env:RUNNER_TEMP 'Ruston mailto test'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $executable = Join-Path $folder 'ruston.exe'
          Copy-Item -LiteralPath 'target/debug/ruston.exe' -Destination $executable
          $choice = 'HKCU:\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\mailto\UserChoice'
          $before = if (Test-Path $choice) { Get-ItemProperty $choice | ConvertTo-Json } else { '' }
          # Other apps' registrations share this key and must survive.
          $apps = 'HKCU:\Software\RegisteredApplications'
          if (-not (Test-Path $apps)) { New-Item -Path $apps | Out-Null }
          New-ItemProperty -Path $apps -Name 'Other app' -Value 'Software\Other\Capabilities' -PropertyType String -Force | Out-Null
          # Twice, as a reinstall would.
          & ./packaging/windows/register-mailto.ps1 -ExecutablePath $executable
          & ./packaging/windows/register-mailto.ps1 -ExecutablePath $executable
          $command = (Get-Item 'HKCU:\Software\Classes\com.luiscuellar.ruston-mail.mailto\shell\open\command').GetValue('')
          if ($command -ne ('"{0}" "%1"' -f $executable)) { throw 'Executable path was not quoted correctly.' }
          $handler = Get-ItemPropertyValue 'HKCU:\Software\Ruston Mail\Capabilities\UrlAssociations' -Name mailto
          if ($handler -ne 'com.luiscuellar.ruston-mail.mailto') { throw 'MAILTO capability was not registered.' }
          $registered = Get-ItemPropertyValue $apps -Name 'Ruston Mail'
          if ($registered -ne 'Software\Ruston Mail\Capabilities') { throw 'Application registration is missing.' }
          if ((Get-ItemPropertyValue $apps -Name 'Other app') -ne 'Software\Other\Capabilities') { throw 'Registration removed another app.' }
          $after = if (Test-Path $choice) { Get-ItemProperty $choice | ConvertTo-Json } else { '' }
          if ($after -ne $before) { throw 'Registration changed the default MAILTO association.' }

          & ./packaging/windows/unregister-mailto.ps1
          if (Test-Path 'HKCU:\Software\Classes\com.luiscuellar.ruston-mail.mailto') { throw 'The mailto handler is still registered.' }
          if (Test-Path 'HKCU:\Software\Ruston Mail') { throw 'The capabilities are still registered.' }
          if ((Get-Item $apps).Property -contains 'Ruston Mail') { throw 'The application is still registered.' }
          if ((Get-ItemPropertyValue $apps -Name 'Other app') -ne 'Software\Other\Capabilities') { throw 'Unregistration removed another app.' }
          $after = if (Test-Path $choice) { Get-ItemProperty $choice | ConvertTo-Json } else { '' }
          if ($after -ne $before) { throw 'Unregistration changed the default MAILTO association.' }

      - name: Verify Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/verify-windows.ps1 -Directory target/debug -Architecture ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}

      - name: Ensure clean workspace
        run: git diff --exit-code

  deny:
    name: Dependency & license integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Untagged upstream: main as of 2026-09-07.
      - uses: bnjbvr/cargo-machete@135555c9cd9f3b4723dee2766f0cacb99aac092b
