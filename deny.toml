# Configuration for cargo-deny

[graph]
targets = []
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
    # Transitive through pgp 0.21's PQC support.
    "RUSTSEC-2025-0144",
    # Transitive through pgp/proton-rpgp; the advisory has no patched rsa release yet.
    "RUSTSEC-2023-0071",
    # zbus_names, zvariant and zvariant_derive are no longer published apart
    # from zbus, which took them in with 6.0. Linux builds reach them through
    # zbus 5: AccessKit's AT-SPI bridge in eframe, the keyring's Secret
    # Service store and the desktop's own D-Bus calls. Neither AccessKit nor
    # the keyring has a zbus 6 release yet, so moving the desktop alone would
    # not drop them.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # crypto-bigint 0.5 can branch on secret values; only 0.7.6 fixes it.
    # pgp reaches 0.5.5 through cx448 and elliptic-curve 0.13 (Ed448, X448,
    # NIST and secp256k1 curves), and proton-srp through its sign-in math.
    # Neither pgp 0.21 nor proton-crypto 0.14 has moved yet. Remove this once
    # proton-crypto brings crypto-bigint 0.7.6 or later.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
]
