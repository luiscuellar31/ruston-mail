[package]
name = "ruston-core"
description = "Unofficial pure-Rust Proton Mail SDK: SRP authentication, OpenPGP end-to-end crypto, and the mail API (transport, send/read, drafts, filters, contacts, local full-text search)."
edition.workspace = true
version.workspace = true
license.workspace = true
authors = ["Filippo Finke <filippofinke@protonmail.ch>", "Luis Cuellar <luiscuellar31@proton.me>"]
rust-version.workspace = true
repository.workspace = true
keywords = ["proton", "protonmail", "email", "openpgp"]
categories = ["email", "api-bindings", "authentication"]

[dependencies]
proton-crypto = { workspace = true }
proton-srp = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
keyring = { workspace = true }
mail-parser = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
urlencoding = { workspace = true }
rusqlite = { workspace = true }
ammonia = { workspace = true }
html5ever = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
