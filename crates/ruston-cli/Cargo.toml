[package]
name = "ruston-cli"
description = "Unofficial command-line client for Proton Mail, built on ruston-core."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["proton", "protonmail", "email", "openpgp", "cli"]
categories = ["email", "command-line-utilities"]

[[bin]]
name = "ruston-cli"
path = "src/main.rs"

[dependencies]
ruston-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }
html5ever = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
